<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ms-MASA Dashboard</title>
  <meta name="description" content="Polymarket market scanner, signals, and order book analysis">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 22V10l8 7 8-7v12" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="brand-name">Ms-MASA</span>
      <span class="brand-sub">Polymarket intelligence</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="markets" aria-selected="true">Markets</button>
      <button class="tab" role="tab" data-tab="signals" aria-selected="false">Signals</button>
      <button class="tab" role="tab" data-tab="knowledge" aria-selected="false">Knowledge</button>
    </nav>
    <div class="topbar-right">
      <span id="mode-badge" class="mode-badge" hidden></span>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh data" title="Refresh">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
      </button>
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme: system" title="Theme">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div id="banner-slot"></div>
    <section id="view" aria-live="polite"></section>
  </main>

  <div id="scrim" class="scrim"></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
    <div class="drawer-head">
      <h2 id="drawer-title">Market</h2>
      <button id="drawer-close" class="icon-btn" type="button" aria-label="Close market details">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
</body>
</html>
